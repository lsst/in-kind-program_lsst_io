repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-toml

  - repo: https://github.com/asottile/blacken-docs
    rev: 1.19.1
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==24.8.0]
        args: [-l, "79", -t, py312]

  # Validate card data whenever a data file changes. Runs in its own Python
  # environment so contributors need nothing installed beyond pre-commit.
  - repo: local
    hooks:
      - id: validate-card-data
        name: Validate card data (ikp_data)
        entry: python -m ikp_data.validate --strict
        language: python
        # Keep these pins at the same major.minor that the site's tox
        # environments resolve (check with `pip show pydantic pyyaml`).
        additional_dependencies: ["pydantic>=2.14,<2.15", "pyyaml>=6.0,<6.1"]
        files: ^docs/contribution-types/_data/
        pass_filenames: false
