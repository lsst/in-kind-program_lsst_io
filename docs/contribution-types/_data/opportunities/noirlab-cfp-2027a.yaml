summary: >-
  NOIRLab has issued the Call for Proposals for Semester 2027A, which includes access
  to many Rubin In-kind contributed facilities. <strong>New in 2027A</strong>: In addition
  to regular single-semester proposals, PIs are invited to request long-term status (up to
  three semesters) on proposals to observe with in-kind contributed facilities. Full details
  on the proposal process, and specific details on each facility and instrument availability
  can be found on the Call for Proposal web page.
