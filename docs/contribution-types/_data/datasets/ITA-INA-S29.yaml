  maintenance_plan: Discrete future Data Releases (e.g. DR2)
  maintenance_notes: 'DR2: has been released in March 2026. It contains reduced images acquired
    over the first 11 years (2011-2022) of the Cosmos and CDF-S fields. It also contains masks
    and source catalogs for the all Cosmos observations of the first 3 years (2011-2013) as
    well as lightcurves (README). DR3: to be released in summer 2026, will extend the Cosmos
    data products and lightcurves to the first 11 years (2011-2022), as well as include masks,
    catalogs and lightcurves for the CDF-S fields up to 2016. DR4: planned for the end of
    2026, will extend the data release to the new TIMEDOMES data including ELAIS-S1 and XMM-LSS.
    DR5: planned for the first half of 2027 will release the full dataset, catalogs and lightcurves
