  validation_limitations: 'Sungle epoch catalogs reach r~23.5 mag. Single-epoch catalogs are
    cross-calibrated to a specific epoch requiring an average rms<0.05 mag for sources between
    r=16-21. Cross-calibration with LSST DP1/DP2 is under way. Limitations are mostly in the
    non-homogeneous area coverage due to past archival data and large temporal gaps. All this
    is shown clearly at: https://sites.google.com/view/timedomes/data?authuser=0'
  tutorials_docs: Jupiter Notbooks for DP1 cross-calibration and light curve extraction are
