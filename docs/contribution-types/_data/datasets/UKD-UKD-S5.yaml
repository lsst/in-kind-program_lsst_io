  summary: 'LSST:UK will provide joint LSST+VISTA near infra-red catalogues produced using
    the LSST Stack and access to VISTA survey images as a dataset contribution, as well as
    an implementation of the LSST Stack pipeline reconfigured to jointly process LSST pixels
    with external survey pixels.

    '
