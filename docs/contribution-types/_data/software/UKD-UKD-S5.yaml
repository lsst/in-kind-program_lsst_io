  version: 'lsst-ir-fusion (version: v1.0.0) and obs_vista (version: v1.2.0).0. Both releases
    are compatible with LSST Science Pipelines v29.2.1.'
  software_url: https://github.com/lsst-uk/obs_vista and https://github.com/lsst-uk/lsst-ir-fusion
  documentation: 'lsst-ir-fusion documentation: https://github.com/lsst-uk/lsst-ir-fusion/blob/master/readme.md
    obs_vista documentation: https://github.com/lsst-uk/obs_vista/blob/master/README.md'
  verification_testing: The software has been validated throughout its development through
    a combination of technical checks, scientific validation, and external review. At each
    stage of the project, progress and results were documented in formal deliverables that
    were reviewed by independent assessors, and their feedback was used to improve the implementation
    and documentation. The development team also validated the resulting images and catalogues
    by checking astrometric and photometric consistency, data quality, source measurements,
    and agreement with external reference catalogues. The resulting data products are already
    being used by collaborators for scientific analysis, including an ongoing publication
    on active galactic nuclei. Feedback to date has confirmed that the products are scientifically
    useful and suitable for research.
  sharing_of_software: The software and its data products have been shared with the recipient
    group throughout development and made available through the UK Data Access Centre and
    the UK Rubin Science Platform. The project has also been presented at several Rubin, LSST,
    and astronomy conferences and meetings, where we described the pipeline, demonstrated
    the resulting products, and explained how interested researchers could request access.
    More recently, the LSST–VISTA Data Preview 1 processing milestone and the availability
    of the associated products were advertised through the Rubin Community Forum. Several
    collaborators and community members are currently accessing and using the products for
    scientific analysis. The source code is also publicly available through the lsst-ir-fusion
    and obs_vista GitHub repositories.
  publications: There are no peer-reviewed publications related to the software contribution
    yet. A paper describing the LSST–VISTA fusion pipeline, its implementation, validation,
    and initial data products is currently in preparation.
  acknowledgements: The standard in-kind software acknowledgement text is suitable. "This
    work makes use of the LSST–VISTA Fusion Pipeline software package, available at https://github.com/lsst-uk/lsst-ir-fusion
    and https://github.com/lsst-uk/obs_vista. This software was developed as a contribution
    to the Rubin community through the Rubin In-Kind Program, with contribution ID UKD-UKD-S5."
  support: Questions about the software can primarily be directed to the project contacts
    by email at [ E.Saremi@soton.ac.uk and M.Banerji-Wright@soton.ac.uk]. The Rubin Community
    Forum may also be used as a secondary channel for questions, discussion, and feedback
    from the wider Rubin community.
  maintenance_plan: Continuously updated rolling release
  maintenance_notes: The software is under active development and will be continuously updated
    as new Rubin LSST data products, Science Pipelines versions, and VISTA datasets become
    available. Major stable stages will continue to be recorded through versioned releases.
  further_development: Further development would include applying and validating the LSST–VISTA
    Fusion Pipeline on DP2 data during the remainder of Phase C. Since Phase C is expected
    to end before the first LSST Data Release, extending the contribution through DR1 would
    allow the pipeline to be adapted, tested, and demonstrated on the first full Rubin data
    release.
