  verification_testing: The software contains a unit test suite that is run frequently. Validation
    is being performed on a set of non-LSST surveys that probe the parameter space crucial
    for ensuring robust LSST cross-matches; these datasets are available through the UK RSP.
  sharing_of_software: Yes, the software is advertised to the wider community often, such
    as at the RCW and LSST@Europe, as well as smaller-scale UK meetings such as NAM. Given
    the slightly odd nature of the software development as a "service" being run by LSST:UK
    for the community, the software has not been widely used by external parties, but the
    datasets generated have been used in a number of science cases so far.
