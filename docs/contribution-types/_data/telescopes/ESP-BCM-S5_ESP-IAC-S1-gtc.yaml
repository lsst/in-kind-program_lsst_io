summary: Roughly two nights per semester will be available at the Gran Telescopio Canarias
  (GTC), a 10.4 meter Optical/NIR telescope in La Palma, Spain, contributed jointly via ESP-BCM-S5
  (Barcelona-Madrid) and ESP-IAC-S1 (IAC). In-kind access to the GTC is not allocated via
  the NOIRLab TAC, but via a dedicated Letter-of-Intent + Spanish TAC co-PI process (see the
  featured opportunity above when a call is open). This contribution is expected to be available
  for ten years from the starting semester.
