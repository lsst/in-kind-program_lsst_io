summary: 20 hours of open-shutter time per year will be available at the twin 8.4m Large Binocular
  Telescope Observatory, within INAF's reserved observing blocks, with the suite of facility
  imaging and spectroscopy instruments provided (only facility instruments are offered).
  Observations are carried out in service mode by INAF staff; programs requiring a strictly
  fixed cadence cannot be supported. ToOs are executed within the INAF blocks; exceptionally
  urgent triggers need approval from the other LBT partners. Raw/calibration data are available
  immediately at archive.lbto.org with a 1-year proprietary period. This contribution is expected
  to be available through FY2034.
