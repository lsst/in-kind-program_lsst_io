summary: 70 hours of observing time on the Nordic Optical Telescope (NOT) is available for
  supernova classification using the ALFOSC instrument (low/medium resolution spectroscopy).
  Successful PIs can submit Soft-ToO triggers for classification and follow-up of transients,
  primarily supernovae -- triggers should be sent the afternoon before observation; this is
  a next-available-night mechanism, not a hard interrupt. Fully reduced spectra are uploaded
  to WISeREP/TNS within 48 hours of observation with no proprietary period. This contribution
  was first made available in Semester 2025A.
