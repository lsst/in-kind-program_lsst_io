summary: Two nights per month are available on the 1.4m Milanković Telescope located at the
  Astronomical Station Vidojevica near Prokuplje, Serbia. Optical imaging is available with
  the Andor iKon-L 936 CCD and Johnson B, V, R, I, L filters plus H-alpha, H-alpha continuum,
  and SII. This facility offers AEON compatibility and is available for target-of-opportunity
  observations; observations are taken in service mode. Raw data are available within 24 hours
  and fully reduced/calibrated data within 72 hours. This contribution was first made available
  in Semester 2025A.
