summary: 'A total of 2-3 nights per semester (5 nights per year on average) will be available
  on the 8.2-meter Subaru Telescope in Hawaii, USA. All instruments offered for open use under
  Subaru''s common-use policy are available; HSC and PFS are primarily in queue mode, while
  all other instruments are in classical mode. Proposers must use the Gemini Phase-I Tool (PIT), not the
  standard NOIRLab dashboard. Note: while Subaru operations may technically support ToO, the
  Rubin community has better ToO access via Gemini North, so this contribution isn''t positioned
  that way. This contribution is expected to be available for 10 years from the starting semester.'
