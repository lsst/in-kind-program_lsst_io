summary: 'Roughly 150 hours per semester will be available on each of the telescopes of the
  Korean Microlensing Telescope Network, 1.6 meter optical imaging telescopes located in Cerro
  Tololo (Chile), Siding Spring Observatory (Australia), and SAAO (South Africa). AEON is
  available for all KMTNet observations, in two modes: 30 minutes at the start or end of every
  night, or pre-allocated AEON nights. This contribution is expected to be available for 5
  years after the first semester.'
