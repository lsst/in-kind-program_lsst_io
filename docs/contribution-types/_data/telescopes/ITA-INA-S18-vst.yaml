summary: 35 pre-allocated nights per year will be available at the 2.6 meter VLT Survey Telescope
  at Paranal, Chile, for imaging observations. ToO requests can typically be accommodated
  on a ~24-hour timescale, subject to instrument availability. Observations are carried out
  in service mode by INAF staff; programs requiring a strictly fixed cadence cannot be supported.
  Raw data are available via the ESO Science Archive as soon as ingested, with a 1-year proprietary
  period. The standard reduction environment is Astro-WISE. This contribution is expected
  to be available through FY2034.
