[tox]
envlist =
    lint,html,test,validate
isolated_build = True

[testenv]
basepython = python
skip_install = true
deps =
    -rrequirements.txt

[testenv:html]
commands =
    sphinx-build -b html -d _build/doctrees/ -n -c . docs _build/html/

[testenv:linkcheck]
description = Check links; fails only on broken links (timeouts are warnings).
# tox hides most environment variables; let the full-check switch through to conf.py.
pass_env =
    IKP_LINKCHECK_FULL
commands =
    # The leading "-" ignores sphinx-build's exit status, because Sphinx fails
    # on timeouts too. The gate script then applies the real pass/fail policy.
    - sphinx-build -b linkcheck -d _build/doctrees/ -n -c . docs _build/linkcheck/
    python scripts/linkcheck_gate.py _build/linkcheck/output.json

[testenv:test]
description = Golden-snapshot tests of the conf.py loaders (see tests/README.md).
deps =
    -rrequirements.txt
    pytest
    time-machine
commands =
    pytest {posargs}

[testenv:validate]
description = Validate the card YAML files against the ikp_data schemas and cross-record checks.
commands =
    python -m ikp_data.validate --strict

[testenv:lint]
description = Lint code and configurations by running pre-commit.
skip_install = true
deps =
    pre-commit
commands = pre-commit run --all-files
