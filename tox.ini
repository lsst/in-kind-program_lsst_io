[tox]
envlist =
    lint,html,test,validate
isolated_build = True

[testenv]
basepython = python
skip_install = true
deps =
    -rrequirements.txt
# tox hides most environment variables. conf.py needs CI and GITHUB_ACTIONS so
# it can refuse the local preview switches (IKP_TODAY, IKP_DATA_DIR) in CI.
# tox does not pass these by default. An env that sets its own pass_env must
# repeat them: its value replaces this one.
pass_env =
    CI
    GITHUB_ACTIONS

[testenv:html]
description = Build the site. Local previews only: IKP_TODAY and IKP_DATA_DIR (see README).
pass_env =
    CI
    GITHUB_ACTIONS
    IKP_DATA_DIR
    IKP_TODAY
commands =
    sphinx-build -b html -d _build/doctrees/ -n -c . docs _build/html/

[testenv:linkcheck]
description = Check links; fails only on broken links (timeouts are warnings).
# tox hides most environment variables; let the full-check switch through to conf.py.
# CI and GITHUB_ACTIONS are repeated because this list replaces the [testenv] one.
pass_env =
    CI
    GITHUB_ACTIONS
    IKP_LINKCHECK_FULL
commands =
    # The leading "-" ignores sphinx-build's exit status, because Sphinx fails
    # on timeouts too. The gate script then applies the real pass/fail policy.
    - sphinx-build -b linkcheck -d _build/doctrees/ -n -c . docs _build/linkcheck/
    python scripts/linkcheck_gate.py _build/linkcheck/output.json

[testenv:test]
description = Golden-snapshot tests of the ikp_data loaders (see tests/README.md).
deps =
    -rrequirements.txt
    pytest
    time-machine
commands =
    pytest {posargs}

[testenv:validate]
description = Validate the card YAML files against the ikp_data schemas and cross-record checks.
commands =
    python -m ikp_data.validate --strict

[testenv:a11y]
description = Accessibility check (axe-core in headless Chromium) of the three card pages.
# Not in envlist: it needs a browser. Build the site first (tox -e html), then run
# tox -e a11y. A different build can be named: tox -e a11y -- path/to/html
# Pinned so that results are repeatable. Playwright 1.65.2 expects the Chromium
# build installed with: python -m playwright install chromium
deps =
    axe-playwright-python==0.1.9
    playwright==1.65.2
commands =
    python scripts/a11y_check.py {posargs:_build/html}

[testenv:lint]
description = Lint code and configurations by running pre-commit.
skip_install = true
deps =
    pre-commit
commands = pre-commit run --all-files
