[tox]
envlist =
    lint,html,test
isolated_build = True

[testenv]
basepython = python
skip_install = true
deps =
    -rrequirements.txt

[testenv:html]
commands =
    sphinx-build -b html -d _build/doctrees/ -n -c . docs _build/html/

[testenv:linkcheck]
commands =
    sphinx-build -b linkcheck -d _build/doctrees/ -n -c . docs _build/linkcheck/

[testenv:test]
description = Golden-snapshot tests of the conf.py loaders (see tests/README.md).
deps =
    -rrequirements.txt
    pytest
    time-machine
commands =
    pytest {posargs}

[testenv:lint]
description = Lint code and configurations by running pre-commit.
skip_install = true
deps =
    pre-commit
commands = pre-commit run --all-files
