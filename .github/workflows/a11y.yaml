# Optional accessibility check: builds the site and runs scripts/a11y_check.py
# (axe-core in headless Chromium) on the three card pages. It runs only when
# started by hand from the Actions tab, and it checks live data only (the
# local preview switches are refused in CI). No secrets are used.
name: Accessibility check

env:
  PYTHON_VERSION: "3.13"

"on":
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history, same as ci.yaml: Documenteer's "last modified"
          # footer and the sitemap read each file's last commit date.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build the site
        run: |
          python -m pip install -r requirements.txt
          sphinx-build -b html -d _build/doctrees/ -n -c . docs _build/html/

      # Same pinned versions as the a11y env in tox.ini.
      - name: Install the checker and its browser
        run: |
          python -m pip install axe-playwright-python==0.1.9 playwright==1.65.2
          python -m playwright install --with-deps chromium

      - name: Run the accessibility check
        run: python scripts/a11y_check.py _build/html --json a11y-report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-report
          path: a11y-report.json
          if-no-files-found: ignore
