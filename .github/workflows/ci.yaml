name: CI

env:
  PYTHON_VERSION: "3.13"

"on":
  push:
    branches-ignore:
      # These should always correspond to pull requests, so ignore them for
      # the push trigger and let them be triggered by the pull_request
      # trigger, avoiding running the workflow twice.  This is a minor
      # optimization so there's no need to ensure this is comprehensive.
      - "dependabot/**"
      - "renovate/**"
      - "tickets/**"
      - "u/**"
    tags:
      - "*"
  pull_request: {}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run pre-commit hooks
        uses: j178/prek-action@v2

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone: Documenteer's
          # sitewide "last modified" footer and the sitemap read each
          # file's last commit date from git. (Card "Updated" dates do
          # not need history; they come from each card's YAML.)
          fetch-depth: 0

      - name: Run tox
        uses: lsst-sqre/run-tox@v1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # validate: every card YAML file must match its schema (ikp_data).
          tox-envs: "html,test,validate"

      - uses: actions/upload-artifact@v4
        with:
          name: html
          path: _build/html/
          if-no-files-found: error

  # Link checking is its own job so that a broken external link (or a flaky
  # host) never blocks the preview upload, which needs only `build`.
  linkcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, same as the build job: the docs build that the
          # link checker performs also needs git dates for Documenteer's
          # "last modified" footer and the sitemap.
          fetch-depth: 0

      - name: Run tox
        uses: lsst-sqre/run-tox@v1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          tox-envs: "linkcheck"

  upload:
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: html
          path: _build/html

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Upload to LSST the Docs
        uses: lsst-sqre/ltd-upload@v1
        with:
          project: "in-kind-program"
          dir: "_build/html"
          username: ${{ secrets.LTD_USERNAME }}
          password: ${{ secrets.LTD_PASSWORD }}
