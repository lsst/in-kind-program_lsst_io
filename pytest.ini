# Minimal pytest configuration.
# Only collect from tests/, so pytest never wanders into the Sphinx docs,
# the virtualenv, or tox's work directory.
[pytest]
testpaths = tests
# Put the repository root on sys.path so tests can `import ikp_data` without
# installing it (tox runs with skip_install = true).
pythonpath = .
norecursedirs = docs _build .venv .tox .git
